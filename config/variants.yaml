# Варианты лабораторной работы: 5 вариантов, 5 методов (по одному на вариант).
#
# Вариант определяется номером в списке группы:
#     variant = ((номер в списке - 1) % 5) + 1
# Примеры: 1 -> 1, 5 -> 5, 6 -> 1, 12 -> 2.
#
# Вариант задаёт МЕТОД. Конкретные параметры метода, препроцессинг
# (missing/transform/scaling) и набор признаков (features.include) вы
# выбираете самостоятельно и обосновываете в docs/planning_session.md.

methods:
  zscore:
    title: "z-score (правило сигм)"
    idea: "Отклонение признака от среднего в стандартных отклонениях."
    artifacts: "mean/std по train, политика нулевой дисперсии"
  iqr:
    title: "IQR (межквартильный размах)"
    idea: "Выход за границы Q1 - m*IQR и Q3 + m*IQR."
    artifacts: "Q1/Q3/IQR по train"
  knn:
    title: "KNN-расстояние"
    idea: "Расстояние до k ближайших соседей в train; далёкие точки — аномалии."
    artifacts: "обученный NearestNeighbors и порог"
  lof:
    title: "Local Outlier Factor"
    idea: "Локальная плотность точки относительно соседей."
    artifacts: "обученный LOF (novelty=True) и порог decision_function"
  ocsvm:
    title: "One-Class SVM"
    idea: "Граница вокруг «нормальной» области в пространстве признаков."
    artifacts: "обученный OneClassSVM и порог decision_function"

variants:
  "1":
    title: "z-score"
    method: zscore
    focus: "Выберите и обоснуйте порог, агрегацию, обработку пропусков/масштаба и политику нулевой дисперсии на основе EDA."
  "2":
    title: "IQR"
    method: iqr
    focus: "Выберите и обоснуйте множитель IQR, правило агрегации и препроцессинг на основе EDA."
  "3":
    title: "KNN-расстояние"
    method: knn
    focus: "Выберите и обоснуйте число соседей, способ scoring/порог, масштабирование и (при необходимости) набор признаков на основе EDA."
  "4":
    title: "Local Outlier Factor"
    method: lof
    focus: "Выберите и обоснуйте число соседей, contamination/порог, препроцессинг и (при необходимости) набор признаков на основе EDA."
  "5":
    title: "One-Class SVM"
    method: ocsvm
    focus: "Выберите и обоснуйте ядро, nu, gamma, препроцессинг и (при необходимости) набор признаков на основе EDA."
